[project]
name = "ideator"
version = "0.1.0"
description = "Generate research ideas experts would not come up with: Claude generators, an Opus critic, and a coach loop."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.6",
]

[project.scripts]
ideator = "alien_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alien_loop"]
